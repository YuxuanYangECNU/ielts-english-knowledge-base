name = "ielts-speaking-api"
main = "worker.js"
compatibility_date = "2026-09-01"

# Fail deployment early if either runtime secret is not actually configured on
# the Worker. Secret values stay in Cloudflare and are never committed here.
[secrets]
required = ["ZHIPU_API_KEY", "DASHSCOPE_API_KEY"]

[vars]
# Keep the current Mainland China Speaking topic bank here as a JSON array
# or configure it in the Cloudflare dashboard.
IELTS_TOPIC_BANK = '["People & relationships","Study & university life","Technology in daily life","Hobbies & free time","Travel & places"]'

# Never put API key values here.
# Store them as Cloudflare Worker secrets instead:
#   wrangler secret put ZHIPU_API_KEY
#   wrangler secret put DASHSCOPE_API_KEY
