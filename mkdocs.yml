site_name: IELTS English Atlas
site_description: A curated IELTS learning atlas for reusable English, speaking patterns and active review.
site_url: https://yuxuanyangecnu.github.io/ielts-english-knowledge-base/

docs_dir: .site_docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  custom_dir: web/overrides
  language: en
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

hooks:
  - scripts/site_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/speaking-hub.css
  - stylesheets/speaking-practice.css

extra_javascript:
  - javascripts/vocabulary.js
  - javascripts/speaking-config.js
  - javascripts/speaking-practice.js
  - javascripts/voice-diagnostics.js

nav:
  - Home: index.md
  - Speaking:
      - knowledge/speaking/README.md
      - Accumulation:
          - knowledge/speaking-topics/README.md
          - Topics:
              - People & Relationships: knowledge/speaking-topics/people-and-relationships.md
      - Practice:
          - knowledge/speaking/practice/README.md
          - Voice: knowledge/speaking/practice/voice.md
          - Chat: knowledge/speaking/practice/chat.md
          - Practice Accumulation:
              - Overview: knowledge/speaking/practice/practice-accumulation/README.md
              - Voice Accumulation: knowledge/speaking/practice/practice-accumulation/voice/README.md
              - Chat Accumulation: knowledge/speaking/practice/practice-accumulation/chat/README.md
  - Listening:
      - knowledge/listening/README.md
      - Accommodation & Renting: knowledge/listening/accommodation-renting.md
  - Reading: knowledge/reading/README.md
  - Writing: knowledge/writing/README.md
  - Language:
      - Vocabulary Tracker: knowledge/vocabulary/README.md
      - Natural Expressions: knowledge/expressions/README.md
      - Grammar & Usage: knowledge/grammar/README.md
      - Personal Error Log: knowledge/corrections/README.md
  - Review: knowledge/review/README.md
