site_name: IELTS English Atlas
site_description: A curated IELTS learning atlas for reusable English, speaking patterns and active review.
site_url: https://yuxuanyangecnu.github.io/ielts-english-knowledge-base/

docs_dir: .site_docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  custom_dir: web/overrides
  language: en
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

hooks:
  - scripts/site_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/search-enhanced.css

extra_javascript:
  - javascripts/vocabulary.js
  - javascripts/search-enhanced.js

nav:
  - Home: index.md
  - Speaking:
      - knowledge/speaking/README.md
      - 话题目录: knowledge/speaking-topics/README.md
      - 人物与关系: knowledge/speaking-topics/people-and-relationships.md
  - Listening:
      - knowledge/listening/README.md
      - 听写正确率: knowledge/listening/dictation-scores.md
      - 咨询场景: knowledge/listening/consultation-scenarios.md
      - 旅游场景: knowledge/listening/travel-tourism.md
      - Accommodation & Renting: knowledge/listening/accommodation-renting.md
  - Reading:
      - knowledge/reading/README.md
      - 错题集:
          - knowledge/reading/mistakes/README.md
          - Artificial intelligence: knowledge/reading/mistakes/004-ai.md
          - Collecting Ant Specimens: knowledge/reading/mistakes/003-ants.md
          - Silbo Gomero: knowledge/reading/mistakes/002-silbo.md
          - Research using twins: knowledge/reading/mistakes/001-twins.md
  - 真题错误分析:
      - knowledge/test-analysis/README.md
      - 听力: knowledge/test-analysis/listening/README.md
      - 阅读: knowledge/test-analysis/reading/README.md
      - 错题词汇: knowledge/test-analysis/vocabulary.md
  - Writing: knowledge/writing/README.md
  - Language:
      - Vocabulary Tracker: knowledge/vocabulary/README.md
      - Natural Expressions: knowledge/expressions/README.md
      - Grammar & Usage: knowledge/grammar/README.md
      - Personal Error Log: knowledge/corrections/README.md
  - Review: knowledge/review/README.md
