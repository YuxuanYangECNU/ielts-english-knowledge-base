site_name: IELTS English Atlas
site_description: A curated IELTS learning atlas for reusable English, speaking patterns and active review.
site_url: https://yuxuanyangecnu.github.io/ielts-english-knowledge-base/

docs_dir: .site_docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/vocabulary.js

nav:
  - Home: index.md
  - Speaking:
      - Speaking Topics: knowledge/speaking-topics/README.md
      - People & Relationships: knowledge/speaking-topics/people-and-relationships.md
      - Story Bank: knowledge/speaking/README.md
  - Listening: knowledge/listening/README.md
  - Reading: knowledge/reading/README.md
  - Writing: knowledge/writing/README.md
  - Language:
      - Vocabulary & Collocations: knowledge/vocabulary/README.md
      - Natural Expressions: knowledge/expressions/README.md
      - Grammar & Usage: knowledge/grammar/README.md
      - Personal Error Log: knowledge/corrections/README.md
  - Review: knowledge/review/README.md
